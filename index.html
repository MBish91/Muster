<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="x-old-theme" content="#1c262c">
<title>Muster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  /* colour */
  --head:#1c262c; --headInk:#f1ece2; --headMuted:#8fa0a8;
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#f3f1ec; --surface-3:#e9e6df;
  --line:#e4e0d7; --line-strong:#d2ccc0;
  --ink:#111111; --ink-2:#3a3732; --muted:#77716a;
  --seal:#c4621d; --seal-ink:#ffffff; --seal-soft:#c4621d17; --ml:#0f9fb4;
  --parch:#efe3c9; --parch-ink:#3d3121;
  --tile:#1c262c; --tile-ink:#f1ece2;
  --kw:#a6501a;

  /* type */
  --serif:Cinzel,"Times New Roman",Georgia,serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  /* shape + depth */
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(17,17,17,.05),0 1px 1px rgba(17,17,17,.03);
  --sh-2:0 6px 18px -8px rgba(17,17,17,.18),0 2px 4px rgba(17,17,17,.04);

  /* space */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;

  /* motion */
  --ease:cubic-bezier(.22,.8,.24,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:140ms; --t-med:260ms; --t-slow:380ms;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1b1b1b; --surface-2:#222; --surface-3:#2a2a2a;
    --line:#2c2c2c; --line-strong:#3a3a3a; --ink:#f0ece3; --ink-2:#cfc9bd; --muted:#9a948a;
    --seal:#e07a2e; --seal-soft:#e07a2e22; --parch:#d8ccaf; --parch-ink:#2a2216;
    --tile:#dfe6e8; --tile-ink:#121212; --kw:#f0a061;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 20px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1b1b1b; --surface-2:#222; --surface-3:#2a2a2a;
  --line:#2c2c2c; --line-strong:#3a3a3a; --ink:#f0ece3; --ink-2:#cfc9bd; --muted:#9a948a;
  --seal:#e07a2e; --seal-soft:#e07a2e22; --parch:#d8ccaf; --parch-ink:#2a2216;
  --tile:#dfe6e8; --tile-ink:#121212; --kw:#f0a061;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 20px -8px rgba(0,0,0,.6);
}

/* =========================================================
   BASE
   ========================================================= */
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px;border-radius:var(--r-xs)}
b,strong{font-weight:700}
table,.pts,.tot b,.big .v b,.cpline .lbl b,.st b,.ac b,.wl b,.rounds button{font-variant-numeric:tabular-nums}

/* =========================================================
   HEADER  (organism)
   ========================================================= */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--headInk);
  box-shadow:0 1px 0 #000,0 8px 24px -16px rgba(0,0,0,.6)}
.brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4) var(--s2);max-width:760px;margin:0 auto}
.crest{width:36px;height:36px;flex:none}
.brand h1{margin:0;font:700 18px/1.15 var(--serif);letter-spacing:.04em}
.brand p{margin:2px 0 0;font:500 12.5px var(--cond);letter-spacing:.06em;color:var(--headMuted)}
.tabs{position:relative;display:flex;max-width:760px;margin:0 auto;padding:0 var(--s2)}
.tabs button{flex:1;background:none;border:0;padding:11px 0 13px;font:600 14.5px var(--cond);letter-spacing:.04em;
  color:var(--headMuted);transition:color var(--t-med) var(--ease)}
.tabs button[aria-selected="true"]{color:var(--headInk)}
.tabs .ind{position:absolute;left:0;bottom:0;height:3px;width:40px;border-radius:3px 3px 0 0;background:var(--seal);
  transform:translateX(0);transition:transform var(--t-slow) var(--ease-out),width var(--t-slow) var(--ease-out)}

main{max-width:760px;margin:0 auto;padding:var(--s4) var(--s3) 56px}
section[hidden]{display:none}
section.enter{animation:secIn var(--t-slow) var(--ease-out) both}
@keyframes secIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =========================================================
   ATOMS
   ========================================================= */
/* section label */
.sect{display:flex;align-items:center;gap:var(--s3);margin:28px 2px var(--s3);font:700 12px var(--serif);letter-spacing:.12em;color:var(--muted);text-transform:none}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.sect:first-child{margin-top:var(--s1)}
.note{font-size:13px;line-height:1.45;color:var(--muted);margin:0 2px var(--s3)}

/* button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 var(--s4);
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);
  font:700 14.5px var(--cond);letter-spacing:.04em;box-shadow:var(--sh-1);
  transition:transform var(--t-fast) var(--ease),background var(--t-med) var(--ease),opacity var(--t-med) var(--ease),box-shadow var(--t-med) var(--ease)}
.btn.pri{background:var(--seal);border-color:transparent;color:var(--seal-ink);box-shadow:0 4px 12px -6px var(--seal)}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none}
.btn:not(:disabled):active,.sq:active,.big button:active,.cpline button:active,.rounds button:active,
.filter button:active,.phbar button:active{transform:scale(.95)}

/* icon square button */
.sq,.big button,.cpline button{display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:var(--r-sm);color:var(--ink);font-size:22px;line-height:1;box-shadow:var(--sh-1);
  transition:transform var(--t-fast) var(--ease),background var(--t-med) var(--ease)}
.sq{width:44px;height:44px}

/* chip / pill */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 var(--s2);border-radius:var(--r-xs);
  font:600 12.5px var(--cond);letter-spacing:.04em;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--s3)}
.filter,.phbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 2px 6px}
.filter::-webkit-scrollbar,.phbar::-webkit-scrollbar{display:none}
.filter button,.phbar button{flex:none;height:34px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line-strong);
  background:var(--surface);font:600 14px var(--cond);letter-spacing:.03em;white-space:nowrap;
  transition:background var(--t-med) var(--ease),color var(--t-med) var(--ease),border-color var(--t-med) var(--ease),transform var(--t-fast) var(--ease)}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.phbar button[aria-pressed="true"]{background:var(--seal);color:#fff;border-color:var(--seal)}

/* badge: CP cost */
.cp{flex:none;display:inline-grid;place-items:center;min-width:44px;height:24px;padding:0 8px;border-radius:var(--r-pill);
  background:var(--seal);color:#fff;font:700 13px var(--cond);letter-spacing:.04em}

/* purity-seal tag (enhancements) */
.seals{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sealtag{position:relative;display:inline-flex;align-items:center;min-height:22px;line-height:1.2;padding:3px 8px 3px 20px;border-radius:var(--r-xs);
  background:var(--parch);color:var(--parch-ink);font:600 12px var(--cond);letter-spacing:.04em}
.sealtag::before{content:"";position:absolute;left:6px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;
  background:var(--seal);box-shadow:inset 0 0 0 1.5px #ffffff55}

/* stat tile */
.stats{display:flex;gap:6px;margin:0 0 var(--s3)}
.st{flex:1;min-width:0;max-width:58px;display:flex;flex-direction:column;align-items:center}
.st small{font:600 10.5px var(--cond);letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.st b{width:100%;height:40px;display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);border-radius:var(--r-sm);
  font:700 19px var(--cond)}
.st.inv b{background:var(--seal);color:#fff}

/* inputs */
label.f{display:block;font:600 12.5px var(--cond);letter-spacing:.06em;color:var(--muted);margin:var(--s3) 0 6px}
input[type=text],textarea,select{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);
  border-radius:var(--r-sm);padding:10px 12px;font:15px/1.4 var(--sans);transition:border-color var(--t-med) var(--ease),box-shadow var(--t-med) var(--ease)}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-soft)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}

/* =========================================================
   MOLECULES
   ========================================================= */
/* card */
.unit,.strat,.panel,.rule,.qi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1)}
.panel{padding:var(--s4);margin:0 0 var(--s3)}
.rule{padding:var(--s3) var(--s4);margin:0 0 var(--s2);font-size:14.5px}
.rule h4{margin:0 0 4px;font:700 17px var(--cond);letter-spacing:.01em}
.rule p{margin:0 0 6px}.rule p:last-child{margin-bottom:0}
.rule.flag{box-shadow:inset 3px 0 0 var(--seal),var(--sh-1)}
.empty{padding:var(--s3) var(--s4);border:1px dashed var(--line-strong);border-radius:var(--r-md);color:var(--muted);font-size:14px;margin:0 0 var(--s3)}
.warn{background:var(--parch);color:var(--parch-ink);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;margin:0 0 var(--s3)}

/* data table */
.tw{overflow-x:auto;margin:0 0 var(--s3);border:1px solid var(--line);border-radius:var(--r-sm);-webkit-overflow-scrolling:touch;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:300px;font:500 15px var(--cond)}
th{background:var(--surface-2);color:var(--muted);font:600 11.5px var(--cond);letter-spacing:.08em;padding:7px 3px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child{text-align:left;padding-left:12px}
th:last-child,td:last-child{padding-right:12px}
td{padding:8px 3px;text-align:center;border-top:1px solid var(--line);vertical-align:top;color:var(--ink)}
tbody tr:first-child td{border-top:0}
td:first-child{text-align:left;padding-left:12px;font-weight:600;font-size:16px}
td .kw{display:block;margin-top:1px;font-weight:500;font-size:12.5px;letter-spacing:.02em;color:var(--kw)}
.tagE{display:inline-block;margin-left:6px;padding:0 6px;border-radius:var(--r-xs);background:var(--parch);color:var(--parch-ink);font-size:11px;vertical-align:2px}

/* wound tracker */
.wounds{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s4);padding:var(--s3);background:var(--surface-2);border-radius:var(--r-sm)}
.wounds .wl{flex:1;min-width:0}
.wounds .wl b{font:700 17px var(--cond)}
.wounds .wl small{display:block;font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--surface-3);border-radius:var(--r-pill);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--ink);transition:width var(--t-slow) var(--ease-out),background var(--t-med) var(--ease)}
.dead .bar i{background:var(--seal)}
.dead .wl b{color:var(--seal)}

/* =========================================================
   ORGANISMS
   ========================================================= */
/* unit accordion */
.unit{margin:0 0 10px;overflow:hidden;transition:box-shadow var(--t-med) var(--ease),border-color var(--t-med) var(--ease)}
.unit[open]{box-shadow:var(--sh-2);border-color:var(--line-strong)}
.unit>summary{list-style:none;display:flex;align-items:center;gap:var(--s3);padding:14px 14px 14px 0;cursor:pointer;user-select:none;-webkit-user-select:none}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary:active{background:var(--surface-2)}
.band{align-self:stretch;width:46px;flex:none;background:var(--head);display:grid;place-items:center;margin:-14px 0}
.band svg{width:20px;height:20px;transition:transform var(--t-slow) var(--ease-out)}
.unit[open] .band svg{transform:rotate(90deg)}
.nm{flex:1;min-width:0}
.nm b{display:block;font:600 18px/1.15 var(--cond);letter-spacing:.01em}
.nm>span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.sumline{display:block;font:600 13px var(--cond);letter-spacing:.03em;color:var(--ink-2);margin-top:4px}
.sumline em{font-style:normal;color:var(--muted);font-weight:500}
.pts{flex:none;text-align:right;font:700 19px/1 var(--cond)}
.pts small{display:block;margin-top:2px;font:600 10.5px var(--cond);letter-spacing:.1em;color:var(--muted)}
.chev{flex:none;width:16px;height:16px;color:var(--muted);transition:transform var(--t-med) var(--ease-out)}
details[open]>summary .chev{transform:rotate(90deg)}
.unit .body-in{animation:fadeUp var(--t-slow) var(--ease-out) both}

/* datasheet */
.ds{border-top:1px solid var(--line);padding:var(--s4)}
.dshead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dshead h3{margin:0;font:700 19px/1.2 var(--cond);letter-spacing:.01em}
.dshead em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.role{margin:2px 0 var(--s3);font-size:13px;color:var(--muted)}
.ab p{margin:0 0 var(--s2);font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.ab p b{color:var(--ink)}
.enhbox{position:relative;background:var(--surface-2);padding:10px 12px 10px 14px;margin:var(--s1) 0 var(--s3);font-size:14px;border-radius:var(--r-sm);color:var(--ink-2)}
.enhbox::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--seal)}
.enhbox b{font:700 15px var(--cond);letter-spacing:.02em;color:var(--ink)}
.enhbox small{color:var(--muted)}
.kwl{font-size:12px;color:var(--muted);margin-top:6px}

/* attacks panel */
.atk{border-top:1px solid var(--line);padding:var(--s4);background:var(--surface-2)}
.atk h4{margin:0 0 10px;font:700 12px var(--serif);letter-spacing:.1em;color:var(--muted)}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin:0 0 var(--s3)}
.tot div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--sh-1)}
.tot small{display:block;font:600 11px var(--cond);letter-spacing:.1em;color:var(--muted)}
.tot b{display:block;font:700 28px/1.1 var(--cond)}
.tot i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.atk table{min-width:0}
.atk tr.alt td{color:var(--muted);font-weight:500}
.atk tr.alt td:first-child{padding-left:24px;font-size:14px}
.atk tr.who td{background:var(--surface-2);font:600 11.5px var(--cond);letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 12px}
.atk .rf{display:block;font-size:12px;color:var(--muted);font-weight:500}
.atk th:nth-child(3),.atk td.ac{background:var(--seal-soft)}
.atk td.ac b{display:block;font:700 18px/1.1 var(--cond);color:var(--ink)}
.atk td.ac span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}

/* stratagem card */
.strat{margin:0 0 10px;overflow:hidden;transition:opacity var(--t-med) var(--ease),transform var(--t-med) var(--ease)}
.strat header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.strat header b{flex:1;font:700 17px var(--cond);letter-spacing:.02em}
.strat .body{padding:12px 14px 4px;font-size:14.5px;color:var(--ink-2)}
.strat .body p{margin:0 0 8px}
.strat .body p span{display:inline-block;min-width:54px;font:700 11.5px var(--cond);letter-spacing:.08em;color:var(--muted)}
.strat footer{display:flex;gap:var(--s2);padding:4px 14px 14px}
.strat.used{opacity:.5}
.strat.used header b::after{content:" · used";font-weight:500;color:var(--muted)}

/* CP banner */
.cpline{display:flex;align-items:center;gap:10px;background:var(--head);color:var(--headInk);border-radius:var(--r-md);padding:10px 12px 10px 16px;margin:0 0 var(--s3);box-shadow:var(--sh-2)}
.cpline .lbl{flex:1;font:600 14px var(--cond);letter-spacing:.06em;color:var(--headMuted)}
.cpline .lbl b{display:inline-block;font:700 28px var(--cond);margin-right:8px;vertical-align:-4px;color:var(--headInk)}
.cpline button{width:40px;height:40px;background:#ffffff10;border-color:#ffffff22;color:var(--headInk);box-shadow:none}

/* battle */
.big{display:flex;align-items:center;gap:var(--s4)}
.big .v{flex:1;text-align:center}
.big .v b{display:inline-block;font:700 48px/1 var(--cond)}
.big .v small{display:block;margin-top:4px;font:600 12px var(--cond);letter-spacing:.12em;color:var(--muted)}
.big button{width:56px;height:56px;border-radius:var(--r-md);font-size:26px}
.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rounds button{height:50px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);font:700 20px var(--cond);box-shadow:var(--sh-1);
  transition:background var(--t-med) var(--ease),color var(--t-med) var(--ease),transform var(--t-fast) var(--ease)}
.rounds button[aria-pressed="true"]{background:var(--seal);color:#fff;border-color:var(--seal);box-shadow:0 4px 12px -6px var(--seal)}
.rounds button.past{color:var(--muted);background:var(--surface-2)}
.doc{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0;padding-top:0}
.doc div{flex:1}
.doc b{font:700 17px var(--cond)}
.doc p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.doc.on b::after{content:"Active";margin-left:8px;padding:2px 7px;border-radius:var(--r-pill);background:var(--seal);color:#fff;font:600 11px var(--cond);letter-spacing:.06em;vertical-align:2px}
.pips{display:flex;gap:5px;margin-top:8px}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);transition:background var(--t-med) var(--ease),transform var(--t-med) var(--ease-out)}
.pip.x{background:var(--ink);transform:scale(.9)}

/* phase quick ref */
.phbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--bg);margin:0 -12px 6px;padding:8px 12px 8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 2px var(--s3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.qi{display:flex;gap:var(--s3);padding:12px 14px 12px 0;margin:0 0 var(--s2);overflow:hidden}
.qi .k{flex:none;width:4px;border-radius:0 3px 3px 0;background:var(--line-strong)}
.qi.strat .k{background:var(--seal)} .qi.doc .k{background:var(--ml)} .qi.det .k{background:#c9b27a}
.qi .bd{flex:1;min-width:0}
.qi .t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.qi .t b{font:700 16.5px var(--cond);letter-spacing:.01em}
.qi .t span{font:600 12px var(--cond);letter-spacing:.05em;color:var(--muted)}

    const u=!/^\s/.test(ln)&&ln.trim().match(/^(.*?)\s*\(([\d,]+)\s*Points?\)\s*$/i);

    if(!cur)continue;

    else if((m=txt.match(/^Enhancements?:\s*(.+)$/i)))cur.enh=m[1].replace(/\s*\((Upgrade)\)\s*$/i,"").trim();
    else if((m=txt.match(/^(\d+)x\s+(.+)$/)))cur.items.push({n:+m[1],name:m[2].trim(),sub:[]});

  out.units.forEach(u=>{

  const sum=out.units.reduce((a,u)=>a+u.pts,0);

function wBase(w){return w.n.replace(/^↳ /,"").split(" – ")[0];}
function gearCount(gear,w){

}
function instDS(keys,gear,qty){
  const score=k=>[...LIB[k].ranged,...LIB[k].melee].filter(w=>!w.n.startsWith("↳")&&gearCount(gear,w)!=null).length;
  const best=keys.slice().sort((a,b)=>score(b)-score(a))[0];
  const base=LIB[best];
  const pick=(type)=>{const seen=new Set(),out=[];
    [best,...keys.filter(k=>k!==best)].forEach(k=>{let parentOn=false,parentC=0;
      LIB[k][type].forEach(w=>{
        if(w.n.startsWith("↳")){if(parentOn&&!seen.has(k+w.n+parentC)){seen.add(k+w.n+parentC);out.push(withCount(w,parentC));}return;}
        const c=gearCount(gear,w);parentOn=c!=null&&!seen.has(w.n);parentC=c;
        if(parentOn){seen.add(w.n);out.push(withCount(w,c));}
      });});
    return out;};
  const withCount=(w,c)=>{const o={...w};delete o.nn;
    if(qty===1){const m=Math.max(w.nn||1,c||1);if(m>1)o.nn=m;}
    else if(c!=null&&c<qty)o.nn=c;

  const d={...base,ranged:pick("ranged"),melee:pick("melee"),qty};

}

/* ---------- attack totals ---------- */
const isPistol=w=>/PISTOL|CLOSE-QUARTERS/.test(w.kw||"");
function aliveOf(u,i,p){const d=DS[p.key],qty=p.qty||d.qty||1,w=d.stats.W,max=qty*w,cur=S.wounds[u.id+"-"+i]??max;return {qty,alive:Math.ceil(cur/w)};}
function markAlts(list){let prev="";return list.map(w=>{const base=w.n.split(" – ")[0];const alt=w.n.startsWith("↳")||(w.n.includes(" – ")&&base===prev);prev=base;return {...w,alt};});}
function cnt(w,qty,alive){if(!alive)return 0;if(w.n_==null)return alive;return qty===1?w.n_:Math.min(w.n_,alive);}
function addT_old(T,a,c){if(!c)return;if(typeof a==="number")T.n+=a*c;else{const m=String(a).match(/^(\d*)D(\d)$/);if(m){const k="D"+m[2];T.d[k]=(T.d[k]||0)+(+(m[1]||1))*c;}else T.n+=0;}}
function addT(T,a,c){if(!c)return;if(typeof a==="number"){T.n+=a*c;return;}const m=String(a).match(/^(\d*)D(\d)(?:\+(\d+))?$/);if(!m)return;const k="D"+m[2];T.d[k]=(T.d[k]||0)+(+(m[1]||1))*c;T.n+=(+(m[3]||0))*c;}
function fmtA(a,c){if(typeof a==="number")return String(a*c);const m=String(a).match(/^(\d*)D(\d)(?:\+(\d+))?$/);if(!m)return a+"×"+c;const q=(+(m[1]||1))*c,k=(+(m[3]||0))*c;return (q===1?"":q)+"D"+m[2]+(k?"+"+k:"");}
function fmtT(T){const parts=[];if(T.n||!Object.keys(T.d).length)parts.push(T.n);for(const k in T.d)parts.push((T.d[k]===1?"":T.d[k])+k);return parts.join(" + ");}
function fmtA_old(a,c){if(typeof a==="number")return String(a*c);const m=String(a).match(/^(\d*)D(\d)$/);if(!m)return a+"×"+c;const q=(+(m[1]||1))*c;return (q===1?"":q)+"D"+m[2];}
function unitAttacks(u){
  const R={n:0,d:{}},M={n:0,d:{}},FR={n:0,d:{}},FM={n:0,d:{}};let rowsR="",rowsM="";
  const who=(d,alive,qty,i)=>`<tr class="who"><td colspan="7"><a href="#" class="dsl" data-ds="${u.id}-${i}">${esc(d.name)}</a> · ${alive}/${qty} ${qty>1?"models":"model"}</td></tr>`;
  const row=(w,c,a,st,notes)=>{
    const tot=c?fmtA(a,c):"–";
    return `<tr class="${w.alt?"alt":""}"><td>${w.alt?"or ":""}${esc(w.n.replace(/^↳ /,""))}${w.kw?`<span class="kw">[${esc(w.kw)}]</span>`:""}${notes}</td><td>${esc(w.r)}</td><td class="ac"><b>${tot}</b><span>${c}×${esc(a)}</span></td><td>${esc(w.s)}</td><td>${esc(st)}</td><td>${esc(w.ap)}</td><td>${esc(w.d)}</td></tr>`;
  };
  u.parts.forEach((p,i)=>{
    const d=DS[p.key],{qty,alive}=aliveOf(u,i,p),e=p.enh&&enhFind(p.enh)&&enhFind(p.enh).weapon;
    const rg=markAlts(d.ranged.map(w=>({...w,n_:w.n_??w.nn}))),ml=markAlts([...d.melee,...(e?[{...e,ench:1}]:[])].map(w=>({...w,n_:w.n_??w.nn})));
    if(rg.length){
      rowsR+=who(d,alive,qty,i);
      const onlyPistols=rg.every(isPistol);
      rg.forEach(w=>{const c=cnt(w,qty,alive),cf=cnt(w,qty,qty),rf=(w.kw||"").match(/RAPID FIRE (\d+)/);
        if(!w.alt&&(!isPistol(w)||onlyPistols)){addT(R,w.a,c);addT(FR,w.a,cf);}
        let notes="";
        if(isPistol(w)&&!onlyPistols)notes+='<span class="rf">Pistol · not in total</span>';
        if(/ONE SHOT/.test(w.kw||""))notes+='<span class="rf">Once per battle</span>';
        if(rf&&c)notes+=`<span class="rf">+${rf[1]*c} attacks at half range</span>`;
        rowsR+=row(w,c,w.a,w.st,notes);});
    }
    if(ml.length){
      rowsM+=who(d,alive,qty,i);
      const mb=u.mBonus||0;let best=null;
      ml.forEach(w=>{const a=typeof w.a==="number"?w.a+mb:w.a,st=typeof w.st==="number"?w.st+mb:w.st,c=cnt(w,qty,alive);
        const ea=/EXTRA ATTACKS/.test(w.kw||""),own=w.nn!=null;
        if((ea||own)&&!w.alt){addT(M,a,c);addT(FM,a,cnt(w,qty,qty));}
        else if(!w.alt&&(best===null||(typeof a==="number"&&a>best.a)))best={a,c,cf:cnt(w,qty,qty)};
        let notes="";
        if(w.ench)notes+='<span class="rf">Enhancement weapon</span>';
        if(ea)notes+='<span class="rf">Extra Attacks · added on top</span>';
        if(mb)notes+='<span class="rf">Includes Crusade of Wrath (+1 A, +1 S)</span>';
        if(u.pious&&(p.lib||p.key).startsWith("marshal"))notes+='<span class="rf">+1 to +3 A from Pious Fervour</span>';
        rowsM+=row(w,c,a,st,notes);});
      if(best){addT(M,best.a,best.c);addT(FM,best.a,best.cf);}
    }

}
function atkBlock(u){
  const t=unitAttacks(u),full=(a,b)=>fmtT(a)!==fmtT(b)?`<i>Full strength ${fmtT(b)}</i>`:"<i>Full strength</i>";
  const tbl=(rows,melee)=>rows?`<div class="tw" style="margin:0 0 10px"><table><thead><tr><th>${melee?"Melee":"Ranged"}</th><th>Range</th><th>A</th><th>${melee?"WS":"BS"}</th><th>S</th><th>AP</th><th>D</th></tr></thead><tbody>${rows}</tbody></table></div>`:"";
  return `<div class="atk"><h4>Total attacks</h4><div class="tot"><div><small>RANGED</small><b>${fmtT(t.R)}</b>${full(t.R,t.FR)}</div><div><small>MELEE</small><b>${fmtT(t.M)}</b>${full(t.M,t.FM)}</div></div>
  ${tbl(t.rowsR,false)}${tbl(t.rowsM,true)}
  <p class="note" style="margin:0">The A column shows total attacks for the unit, with models × attacks underneath. Ranged total counts every main gun (pistols left out unless they're the only gun). Melee total uses each model's best weapon, plus any Extra Attacks weapons. Totals drop as you remove wounds.</p></div>`;
}

function card(s){

function toggleUnit(d){
  const sm=d.querySelector("summary");

  const start=d.getBoundingClientRect().height;
  let end,closing=d.open;
  if(closing){end=sm.getBoundingClientRect().height+2;}else{d.open=true;end=d.getBoundingClientRect().height;}
  d._anim=d.animate([{height:start+"px"},{height:end+"px"}],{duration:closing?260:340,easing:"cubic-bezier(.16,1,.3,1)"});
  const cut=d.querySelector(".cutout");
  if(cut){const k=[{opacity:0,transform:"translateX(75%) scale(.45)"},{opacity:1,transform:"none"}];
    if(closing)cut.animate(k.slice().reverse(),{duration:260,easing:"cubic-bezier(.5,0,.75,0)",fill:"forwards"});

/* Plain-English wording written by Claude, merged into the bundled numbers. */
let TXT={},SYNC=null,PAUSED=false;
function applyTxt(){
  Object.values(LIB).forEach(L=>{if(!L.wh)return;const t=TXT[qid("unit",L.name)];if(!t)return;
    const by={};(t.abilities||[]).forEach(a=>by[nrm(a.name)]=a.text);
    L.abilities=L.abilities.map(([n,x])=>[n,x||by[nrm(n)]||""]);
    (t.abilities||[]).forEach(a=>{if(!L.abilities.some(([n])=>nrm(n)===nrm(a.name)))L.abilities.push([a.name,a.text]);});
    L.page="Wahapedia 11th ed. · wording by Claude";L.note="";});
  Object.values(DETR).forEach(D=>{if(!D.wh)return;const t=TXT[qid("det",D.n)];if(!t)return;
    if(t.rule)D.rule=[t.rule.name||D.rule[0],t.rule.text||""];if(t.phase)D.ph=t.phase;
    const st={};(t.stratagems||[]).forEach(s=>st[nrm(s.name)]=s);
    STRATLIB.forEach(s=>{if(!s.wh||nrm(s.det)!==nrm(D.n))return;const x=st[nrm(s.n)];if(x){s.target=x.target||"";s.effect=x.effect||"";if(x.when)s.when=x.when;}});
    (t.enhancements||[]).forEach(e=>{const k=Object.keys(ENH).find(n=>nrm(n)===nrm(e.name));if(k&&ENH[k].wh&&!ENH[k].done){ENH[k].text=(ENH[k].text?ENH[k].text+". ":"")+e.text;ENH[k].done=1;}});});
  Object.values(FACDB).forEach(F=>{if(!F.wh)return;const t=TXT[qid("fac",F.label)];if(!t)return;
    const by={};(t.armyRules||[]).forEach(a=>by[nrm(a.name)]=a.text);
    F.armyRules=(F.armyRules||[]).map(r=>({name:r.name,text:r.text||by[nrm(r.name)]||""}));
    const th="f-"+slug(F.label);if(FACTIONS[th])FACTIONS[th].army=F.armyRules.map(r=>[r.name,r.text]);});
}

async function loadTxt(){await seedTxt();if(!DB){applyTxt();return;}try{const q=await DB.collection("txt").get();q.docs.forEach(d=>{const v=d.data();if(v)TXT[d.id]=v;});}catch(e){}

    if(JSON.stringify([Object.keys(TXT).length,Object.keys(ARTDB).length])!==before){if(!Object.keys(ARTQ).length&&!Object.keys(QUEUE).length)SYNCSTATE="";refreshAfterAI();}
    if((!Object.keys(ARTQ).length&&!Object.keys(QUEUE).length)||n>60){clearInterval(WATCH);WATCH=null;}

const unitURL=(fac,name)=>[WAHA+fac+"/"+String(name).replace(/[’'"]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,""),

async function fillText(){
  if(AIBUSY||!SAMPLE)return;AIBUSY=true;AILOG=[];renderArmy();
  const log=(t,s="")=>{AILOG.push({t,s});renderArmy();};
  const done=(s,extra)=>{const l=AILOG[AILOG.length-1];l.s=s;l.t=l.t.replace(/…$/,"")+(extra?` (${extra})`:"");renderArmy();};
  const items=[...textNeeds(),...Object.values(QUEUE)].filter((x,i,a)=>a.findIndex(y=>qid(y.kind,y.name)===qid(x.kind,x.name))===i);

    for(const it of items){
      const id=qid(it.kind,it.name),now=new Date().toISOString();

        if(r.found===false||!r.stats||r.stats.T==null){done("bad","didn't match");continue;}
        const doc={name:it.name,faction:it.label,ds:r,conf:"verified",ai:false,verified:true,src:"Read from Wahapedia 11th ed. by Claude",art:r.art&&r.art.desc?{desc:String(r.art.desc),wide:!!r.art.wide}:null,at:now};
        applyLib(doc);await put("lib",slug(it.name),doc);done("ok");
      }else if(it.kind==="det"){log(`Detachment text: ${it.name}…`);
        const page=await facPage(it.fac);if(BROWSER_OK===false){done("bad","needs the Claude desktop app");break;}
        const bit=page?detSlices(page,it.name):"";if(!bit){done("bad","page not found");continue;}
        const r=await SAMPLE.json(`${SYS_READ}\nFaction: ${it.label}. Detachment: "${it.name}".\nPage text:\n<<<\n${bit}\n>>>\nReturn {"found":boolean,"name":"${it.name}","dp":number or null,"rule":{"name":string,"text":string},"phase":"cmd|move|shoot|charge|fight|opp|any (when the rule mostly matters)","stratagems":[{"name":string,"cp":number,"type":string,"when":string,"target":string,"effect":string}],"enhancements":[{"name":string,"pts":number,"upgrade":boolean,"text":string}]}`,{modelTier:"default"});
        if(r.found===false){done("bad","didn't match");continue;}
        const doc={...r,name:it.name,ai:false,verified:true,src:"Read from Wahapedia 11th ed. by Claude",at:now};
        delete DETR[nrm(it.name)];for(let i=STRATLIB.length-1;i>=0;i--)if(nrm(STRATLIB[i].det)===nrm(it.name)&&STRATLIB[i].wh)STRATLIB.splice(i,1);
        Object.keys(ENH).forEach(k=>{if(ENH[k].wh&&nrm(ENH[k].det)===nrm(it.name))delete ENH[k];});
        applyDet(doc);await put("dets",slug(it.name),doc);done("ok");
      }else{log(`Army rules text: ${it.name}…`);
        const page=await facPage(it.fac);if(BROWSER_OK===false){done("bad","needs the Claude desktop app");break;}
        if(!page){done("bad","page not found");continue;}
        const i=page.search(/Army Rules/i);const r=await SAMPLE.json(`${SYS_READ}\nFaction: ${it.label}.\nPage text:\n<<<\n${page.slice(Math.max(0,i),Math.max(0,i)+16000)}\n>>>\nReturn {"armyRules":[{"name":string,"text":string}]}`,{modelTier:"default"});
        const old=FACDB[nrm(it.label)]||{};const doc={label:it.label,factions:old.factions||[it.label],armyRules:r.armyRules||[],colors:old.colors||{},usesDoctrines:false,ai:false,verified:true,src:"Read from Wahapedia 11th ed. by Claude",at:now};
        applyFac(doc);await put("facs",slug(it.label),doc);done("ok");}
      delete QUEUE[id];if(DB){try{await DB.collection("queue").doc(id).delete();}catch(e){}}

function armed(btn,label){
  if(btn.dataset.armed==="1"){clearTimeout(btn._t);delete btn.dataset.armed;return true;}
  btn.dataset.armed="1";btn._old=btn.innerHTML;btn.innerHTML=label;btn.classList.add("armed");
  btn._t=setTimeout(()=>{delete btn.dataset.armed;btn.innerHTML=btn._old;btn.classList.remove("armed");},3500);return false;

"PRECISION":"If the target is an attached unit containing a CHARACTER, you can allocate these attacks to that CHARACTER. No effect on units without a CHARACTER.",

"RAPID FIRE":"+X Attacks if the target is within half the weapon's range.",

"TORRENT":"Attacks with this weapon automatically hit. No Hit roll is made.",
"TWIN-LINKED":"You can re-roll the Wound roll for attacks with this weapon.",

"DEEP STRIKE":"Can start in Reserves and arrive later, set up more than 8\" from all enemy models.",

"SCOUTS":"Before the first turn, this unit can make a Normal move of up to X\".",

"BENEFIT OF COVER":"Better armour save against ranged attacks when the target is in or behind cover."
};
const T={"CONVERSION":"Conversion","INDIRECT FIRE":"Indirect Fire"};
const cap=s=>s.toLowerCase().replace(/(^|[ \-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function resolve(raw){
  let t=raw.trim().toUpperCase().replace(/\s+/g," ");let cond="";
  const ci=t.indexOf(":");if(ci>0){cond=t.slice(ci+1).trim();t=t.slice(0,ci).trim();}
  if(/^ANTI-/.test(t)){const m=t.match(/^ANTI-(.+?)(?:\s+(\d\+))?$/);return {title:"Anti-"+cap(m[1])+(m[2]?" "+m[2]:""),text:G.ANTI.replace("the listed keyword",cap(m[1]).toUpperCase()).replace("Y+",m[2]||"Y+"),cond};}
  const v=t.match(/^(.*?)(?:\s+(\d+\+?|D\d(?:\+\d)?|X))?$/);let base=v[1],val=v[2]||"";
  if(!G[base]&&G[t]){base=t;val="";}
  if(!G[base])return null;
  let txt=G[base];if(val)txt=txt.replace(/\bX\b(")?/g,base==="SCOUTS"?val+'"':val);
  return {title:cap(base)+(val?" "+val:""),text:txt,cond};
}
const names=Object.keys(G).filter(k=>k!=="ANTI"&&k!=="BENEFIT OF COVER").sort((a,b)=>b.length-a.length).map(s=>s.replace(/[-]/g,"\\-")).join("|");
const RE=new RegExp("\\[([^\\]\\n]{2,90})\\]|\\b(ANTI-[A-Z][A-Z\\/\\-]*(?:\\s\\d\\+)?|(?:"+names+")(?:\\s(?:\\d+\\+?|D\\d|X)(?![A-Za-z0-9]))?)","g");
const SKIP="SCRIPT,STYLE,TEXTAREA,INPUT,SELECT,BUTTON,.kwt,#kwpop,#pasteBox";
function tok(raw,chip){const r=resolve(raw);if(!r)return null;const a=document.createElement("a");a.className="kwt";a.href="#";a.dataset.k=raw.trim();a.textContent=raw.trim();return a;}
function wrapNode(n){
  const s=n.nodeValue;if(!s||s.length<3||!/[A-Z]{3}/.test(s))return;RE.lastIndex=0;if(!RE.test(s))return;RE.lastIndex=0;
  const f=document.createDocumentFragment();let i=0,m,any=false;
  while((m=RE.exec(s))){
    if(m[1]!==undefined){
      const parts=m[1].split(/(\s*,\s*)/);let ok=false;const frag=document.createDocumentFragment();
      parts.forEach(p=>{if(/^\s*,\s*$/.test(p)){frag.append(p);return;}const a=tok(p);if(a){ok=true;frag.append(a);}else frag.append(p);});
      if(!ok)continue;
      f.append(s.slice(i,m.index),"[");f.append(frag);f.append("]");i=m.index+m[0].length;any=true;
    }else{
      const a=tok(m[2]);if(!a)continue;
      f.append(s.slice(i,m.index));f.append(a);i=m.index+m[0].length;any=true;
    }
  }
  if(!any)return;f.append(s.slice(i));n.replaceWith(f);
}
function scan(root){
  if(root.nodeType===3){if(!root.parentElement||root.parentElement.closest(SKIP))return;wrapNode(root);return;}
  if(root.nodeType!==1||root.closest(SKIP))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&!n.parentElement.closest(SKIP)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(wrapNode);
}
/* chips on datasheets: core abilities like Stealth, Deep Strike, Feel No Pain 5+ */
function chips(root){(root.nodeType===1?root:document).querySelectorAll?.(".chip:not(.kwt)").forEach(c=>{if(c.querySelector(".kwt"))return;const r=resolve(c.textContent);if(r){c.classList.add("kwt");c.dataset.k=c.textContent.trim();}});}
let busy=false,pend=new Set(),sch=false;
const obs=new MutationObserver(ms=>{if(busy)return;ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)pend.add(n)}));
  if(!sch&&pend.size){sch=true;requestAnimationFrame(()=>{sch=false;busy=true;try{pend.forEach(n=>{if(n.isConnected){scan(n);chips(n);}});}catch(e){}pend.clear();busy=false;});}});
function boot(){scan(document.body);chips(document);obs.observe(document.body,{childList:true,subtree:true,characterData:false});}
/* pop-out */
let pop=null,anchor=null;
function close(){if(pop){pop.remove();pop=null;anchor=null;}}
function open(a){
  const r=resolve(a.dataset.k);if(!r)return;if(anchor===a){close();return;}close();anchor=a;
  pop=document.createElement("div");pop.id="kwpop";pop.setAttribute("role","dialog");
  pop.innerHTML=`<b>${r.title}</b><p>${r.text}</p>${r.cond?`<p class="kwc">Only against: ${r.cond.toLowerCase()}.</p>`:""}`;
  document.body.append(pop);
  const b=a.getBoundingClientRect(),W=window.innerWidth,H=window.innerHeight,pw=pop.offsetWidth,ph=pop.offsetHeight;
  let x=Math.max(8,Math.min(W-pw-8,b.left+b.width/2-pw/2)),y=b.bottom+8;if(y+ph>H-8)y=Math.max(8,b.top-ph-8);
  pop.style.left=x+"px";pop.style.top=y+"px";
}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest(".kwt");
  if(a){e.preventDefault();e.stopPropagation();open(a);return;}
  if(pop&&!e.target.closest("#kwpop"))close();},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
window.addEventListener("scroll",close,{passive:true,capture:true});
window.addEventListener("resize",close);
const css=document.createElement("style");css.textContent=`
.kwt{color:inherit;text-decoration:underline dotted;text-decoration-color:var(--seal,#c4621d);text-underline-offset:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip.kwt{text-decoration:none;cursor:pointer}
#kwpop{position:fixed;z-index:9999;width:min(300px,calc(100vw - 16px));background:var(--bgc,#fff);color:var(--ink,#111);border:1px solid var(--line,#ccc);border-left:4px solid var(--seal,#c4621d);border-radius:10px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.35);font:400 14px/1.4 var(--sans,system-ui);text-transform:none;letter-spacing:0}
#kwpop b{display:block;font:700 15px var(--cond,var(--sans,system-ui));margin-bottom:3px}
#kwpop p{margin:0}#kwpop .kwc{margin-top:5px;font-size:12.5px;color:var(--muted,#666)}`;
document.head.append(css);
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
